name: Terraform Plan and Apply for backend

on:
  push:
    branches:
      # - main
      - feature/azure_infra_setup_for_leaderboard

permissions:
  contents: read

jobs:
  plan:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./backend/infra/terraform
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      
      - name: Terraform fmt
        run: terraform fmt -check
    
      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate
      
      - name: Terraform plan
        run: terraform plan
