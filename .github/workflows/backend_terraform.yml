name: Terraform Plan and Apply for backend

on:
  push:
    branches:
      # - main
      - feature/azure_infra_setup_for_leaderboard

permissions:
  contents: read

jobs:
  plan:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./backend/infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      
      - name: Terraform fmt
        run: terraform fmt -check
    
      - name: Terraform Init
        run: terraform init
      
      - name: Terraform Plan
        run: terraform plan